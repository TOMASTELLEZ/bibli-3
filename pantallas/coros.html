<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himnos de coros - Memoriza La Palabra</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/biblia.css">
    <link rel="stylesheet" href="../css/coros.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../img/logo_2.png">
    <meta name="theme-color" content="#0b1e3e">
</head>
<body class="coros-page">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar">
        <div class="logo">
            <img src="../img/logo.png" alt="Logo">
            <div>
                <h2>Memoriza</h2>
                <span>LA PALABRA</span>
            </div>
        </div>

        <button class="mobile-menu-btn" id="mobile-menu-btn" type="button"
            aria-expanded="false" aria-controls="main-navigation">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
            <span>Menú</span>
        </button>
        <nav id="main-navigation" aria-label="Navegación principal">
            <a href="../index.html">
                <i class="fa-solid fa-house"></i> Inicio
            </a>
            <a href="biblia.html">
                <i class="fa-solid fa-book-bible"></i> Biblia
            </a>
            <a href="memorizar.html">
                <i class="fa-solid fa-brain"></i> Memorizar versículos
            </a>
            <a class="active" href="coros.html">
                <i class="fa-solid fa-music"></i> Himnos de coros
            </a>
        </nav>

        <div class="verse-card">
            <h4>Versículo del día</h4>
            <p class="reference" id="referencia">Salmos 95:1</p>
            <p id="textoVersiculo">"Venid, aclamemos alegremente a Jehová; cantemos con júbilo a la roca de nuestra salvación."</p>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Himnos de coros</h1>
            <p>Selecciona un himno para consultar su letra y acordes.</p>
        </header>

        <div class="himnos-search">
            <label for="buscar-himno">Buscar himno por número o nombre</label>
            <input id="buscar-himno" type="search" inputmode="search"
                placeholder="Por ejemplo: 12" autocomplete="off">
            <p id="resultado-busqueda-himnos" role="status" aria-live="polite"></p>
        </div>

        <div class="bible-container">
            <section class="testament-section">
                <h3 class="testament-title">Himnos</h3>
                <div class="books-grid" id="lista-himnos"></div>
            </section>
        </div>
    </main>

    <script type="module" src="../js/coros.js"></script>
    <script type="module" src="../js/versiculo_diario.js"></script>
    <script src="../js/mobile-menu.js"></script>
    <script src="../js/register-sw.js"></script>
</body>
</html>
